[package]
name = "pi-gui-core"
version = "0.1.0"
description = "pi-gui's app logic in Rust: saved data now, more parts as they move over from Electron main."
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
chrono-tz = { version = "0.10.4", features = ["case-insensitive"] }
iana-time-zone = "0.1.65"
icu_collator = "2"
indexmap = "2.14.2"
ryu = "1.0.23"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1.53.2", features = ["rt", "macros", "io-util", "io-std", "process", "sync", "time", "fs"] }
uuid = { version = "1.27.0", features = ["v4"] }
