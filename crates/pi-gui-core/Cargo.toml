[package]
name = "pi-gui-core"
version = "0.1.0"
description = "pi-gui's app logic in Rust: saved data now, more parts as they move over from Electron main."
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
icu_collator = "2"
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1.53.2", features = ["rt", "macros", "io-util", "io-std", "process", "sync", "time", "fs"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
