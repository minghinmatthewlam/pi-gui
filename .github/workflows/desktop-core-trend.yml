name: Desktop Core Trend

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-core-trend
  cancel-in-progress: false

jobs:
  desktop-core-trend:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build desktop
        run: pnpm --filter @pi-gui/desktop build

      - name: Run desktop core once
        env:
          PI_APP_TEST_MODE: background
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ github.workspace }}/apps/desktop/test-results/desktop-core-trend.json
        run: >-
          pnpm --filter @pi-gui/desktop run test:e2e:runner --
          apps/desktop/tests/core
          --workers=1
          --retries=0
          --reporter=line,json

      - name: Group trend results by spec
        if: always()
        run: >-
          node .github/scripts/summarize-playwright-trend.mjs
          apps/desktop/test-results/desktop-core-trend.json
          apps/desktop/test-results/desktop-core-trend-summary.json

      - name: Upload desktop core trend artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-core-trend-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/desktop/test-results/
          retention-days: 30
          if-no-files-found: error
